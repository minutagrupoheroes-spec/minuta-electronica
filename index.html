  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0;
      color: #0b3d91;
      font-size: 27px;
    }

    .subtitulo {
      margin: 12px 0 25px;
      color: #555555;
      font-size: 16px;
      line-height: 1.5;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      background: #0b3d91;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow:
        0 5px 15px rgba(11, 61, 145, 0.25);
    }

    .boton:active {
      transform: scale(0.98);
    }

    .pie {
      margin-top: 22px;
      color: #777777;
      font-size: 13px;
