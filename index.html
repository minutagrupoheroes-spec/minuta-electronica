<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#0b3d91">

  <meta
    name="application-name"
    content="MINUTA ELECTRÓNICA">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-title"
    content="MINUTA">

  <link
    rel="manifest"
    href="manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    href="icono.png">

  <link
    rel="apple-touch-icon"
    href="icono.png">

  <title>MINUTA ELECTRÓNICA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.15);
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    h1 {
      display: block;
      width: 100%;
      margin: 0;
      color: #0b3d91;
      font-size: 27px;
      text-align: center;
    }

    .subtitulo {
      margin: 12px 0 25px;
      color: #555555;
      font-size: 16px;
      line-height: 1.5;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      background: #0b3d91;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow:
        0 5px 15px rgba(11, 61, 145, 0.25);
    }

    .boton:active {
      transform: scale(0.98);
    }

    .pie {
      margin-top: 22px;
      color: #777777;
      font-size: 13px;
    }

  </style>

</head>

<body>

  <script>
  setTimeout(function() {
    window.location.href =
      "https://script.google.com/macros/s/AKfycbxKgDOp95V-tjPi3DutKbpnJktsA8LZdNEq1afealvt8bTuN7FFV2koJbG90ArR8i-42Q/exec";
  }, 1500);
</script>

    <img
      class="logo"
      src="icono.png"
      alt="Escudo MINUTA ELECTRÓNICA">

    <h1>
      MINUTA ELECTRÓNICA
    </h1>

    <p class="subtitulo">
      Sistema de gestión y consulta
      de minutas.
    </p>

<a
  id="botonMinuta"
  class="boton"
  href="https://script.google.com/macros/s/AKfycbxKgDOp95V-tjPi3DutKbpnJktsA8LZdNEq1afealvt8bTuN7FFV2koJbG90ArR8i-42Q/exec"
  onclick="mostrarCargaMinuta()">
  🛡️ ABRIR MINUTA ELECTRÓNICA
</a>

<script>
function mostrarCargaMinuta() {
  const boton = document.getElementById("botonMinuta");

  if (boton) {
    boton.textContent = "⏳ CARGANDO MINUTA...";
    boton.style.opacity = "0.75";
    boton.style.pointerEvents = "none";
  }
}
</script>



    <div class="pie">
      MINUTA ELECTRÓNICA
    </div>

  </main>

</body>

</html>
